server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: payment-service
  threads:
    virtual:
      # Off on Java 21: the Kafka client and parts of JDBC block inside synchronized code, which pins
      # virtual threads to their carrier threads and starves the saga consumers (fixed in JDK 24, JEP 491).
      enabled: ${VIRTUAL_THREADS:false}
  task:
    scheduling:
      pool:
        size: 2              # outbox relay and saga watchdog don't queue behind each other
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payments}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # Commit offsets once per poll, not once per record. Safe because every handler is idempotent
      # (inbox table / upsert by event id): a crash just redelivers a batch that is then skipped.
      ack-mode: batch
      concurrency: 6         # one consumer thread per partition

orderflow:
  providers:
    failure-rate: ${PROVIDER_FAILURE_RATE:0.05}   # 5% transient timeouts to exercise retry + circuit breaker
    card:
      limit: 2500
    upi:
      limit: 1000
    wallet:
      limit: 300

resilience4j:
  retry:
    instances:
      provider:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.vipinkumar.orderflow.payment.provider.ProviderUnavailableException
  circuitbreaker:
    instances:
      provider:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.vipinkumar.orderflow.payment.provider.ProviderUnavailableException
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
