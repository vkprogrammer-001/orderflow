name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (JUnit 5 + Mockito)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -ntp verify -Pit

  tooling:
    name: Go load generator
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: tools/loadgen }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22", cache-dependency-path: tools/loadgen/go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  images:
    name: Build and push images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration, tooling]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, audit-service, console]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'console' && 'console' || '.' }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to EKS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EKS_CLUSTER != ''
    needs: images
    runs-on: ubuntu-latest
    environment: production          # requires a manual approval rule in repo settings
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}   # OIDC, no long-lived keys
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER }}"
      - name: Pin images to this commit
        working-directory: k8s/overlays/eks
        run: |
          for s in order-service inventory-service payment-service audit-service console; do
            kustomize edit set image ghcr.io/vkprogrammer-001/orderflow/$s=ghcr.io/${{ github.repository }}/$s:${{ github.sha }}
          done
      - run: kubectl apply -k k8s/overlays/eks
      - name: Wait for rollout (fails the job, and keeps old pods serving, if new pods never get ready)
        run: |
          for s in order-service inventory-service payment-service audit-service console; do
            kubectl -n orderflow rollout status deploy/$s --timeout=5m
          done
