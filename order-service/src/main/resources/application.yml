server:
  port: 8081
  shutdown: graceful
  tomcat:
    threads:
      # Bulkhead: cap request threads below the DB pool so API traffic can never take every
      # connection. Excess requests queue in Tomcat, and the saga consumers, outbox relay and
      # watchdog always find a free connection.
      max: 40

spring:
  application:
    name: order-service
  threads:
    virtual:
      # Off on Java 21: the Kafka client and parts of JDBC block inside synchronized code, which pins
      # virtual threads to their carrier threads and starves the saga consumers (fixed in JDK 24, JEP 491).
      enabled: ${VIRTUAL_THREADS:false}
  task:
    scheduling:
      pool:
        size: 2              # outbox relay and saga watchdog don't queue behind each other
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:50}   # 40 request threads + 6 saga consumers + relay + watchdog
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # Commit offsets once per poll, not once per record. Safe because every handler is idempotent
      # (inbox table / upsert by event id): a crash just redelivers a batch that is then skipped.
      ack-mode: batch
      concurrency: 6         # one consumer thread per partition
  graphql:
    graphiql:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

orderflow:
  security:
    api-key: ${ORDERFLOW_API_KEY:local-dev-key-change-me}
  saga:
    step-timeout: PT2M
  outbox:
    poll-interval-ms: 200
    batch-size: 500        # the API writes two outbox rows per order; bigger batches keep the relay ahead of bursts

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p [orderId=%X{orderId:-}]"
