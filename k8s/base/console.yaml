apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: { app.kubernetes.io/name: console, app.kubernetes.io/part-of: orderflow }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: console, app.kubernetes.io/part-of: orderflow }
    spec:
      containers:
        - name: nginx
          image: ghcr.io/vkprogrammer-001/orderflow/console:latest
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: ORDERFLOW_API_KEY
              valueFrom: { secretKeyRef: { name: orderflow-secrets, key: api-key } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: console
spec:
  selector: { app.kubernetes.io/name: console }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  annotations:
    alb.ingress.kubernetes.io/scheme: internal       # AWS Load Balancer Controller; internal-only ops tool
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: console, port: { name: http } } }
