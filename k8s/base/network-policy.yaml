# Default-deny ingress inside the namespace, then allow only the edge -> services path and probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-console-to-services
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/part-of: orderflow }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: console } }
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
---
# The console is the only thing reachable from outside the namespace (via the internal ALB).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-console
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: console }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8080 }]
