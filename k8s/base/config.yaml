apiVersion: v1
kind: ConfigMap
metadata:
  name: orderflow-config
data:
  KAFKA_BOOTSTRAP: kafka-bootstrap:9092     # e.g. Amazon MSK bootstrap brokers
  DB_HOST: orderflow-postgres               # e.g. Amazon RDS / Aurora PostgreSQL endpoint
  JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
  SPRING_KAFKA_LISTENER_CONCURRENCY: "3"
---
# Placeholder only. In a real cluster this comes from AWS Secrets Manager via External Secrets,
# or from Sealed Secrets. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-secrets
type: Opaque
stringData:
  db-user: orderflow
  db-password: change-me
  mongo-uri: mongodb://orderflow-mongo:27017/audit
  api-key: change-me-to-a-long-random-value
