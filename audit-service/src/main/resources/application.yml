server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: audit-service
  threads:
    virtual:
      # Off on Java 21: the Kafka client and parts of JDBC block inside synchronized code, which pins
      # virtual threads to their carrier threads and starves the saga consumers (fixed in JDK 24, JEP 491).
      enabled: ${VIRTUAL_THREADS:false}
  task:
    scheduling:
      pool:
        size: 2              # outbox relay and saga watchdog don't queue behind each other
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/audit}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # Commit offsets once per poll, not once per record. Safe because every handler is idempotent
      # (inbox table / upsert by event id): a crash just redelivers a batch that is then skipped.
      ack-mode: batch
      concurrency: 2         # off the critical path: leave CPU for the saga

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
