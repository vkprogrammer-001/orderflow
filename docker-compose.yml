# Whole platform on one machine:  docker compose up --build   then open http://localhost:8080
name: orderflow

x-java-service: &java
  build:
    context: .
  restart: unless-stopped
  environment: &java-env
    KAFKA_BOOTSTRAP: kafka:9092
    DB_HOST: postgres
    DB_USER: orderflow
    DB_PASSWORD: orderflow
    ORDERFLOW_API_KEY: ${ORDERFLOW_API_KEY:-local-dev-key-change-me}
    JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+UseG1GC
    VIRTUAL_THREADS: ${VIRTUAL_THREADS:-false}   # set to true to compare
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]   # three services' pools share one server here
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  mongo:
    image: mongo:7
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10

  order-service:
    <<: *java
    build: { context: ., args: { SERVICE: order-service } }
    environment:
      <<: *java-env
      DB_NAME: orders
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 5s
      retries: 30
      start_period: 20s

  inventory-service:
    <<: *java
    build: { context: ., args: { SERVICE: inventory-service } }
    environment:
      <<: *java-env
      DB_NAME: inventory
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8082:8082"]

  payment-service:
    <<: *java
    build: { context: ., args: { SERVICE: payment-service } }
    environment:
      <<: *java-env
      DB_NAME: payments
      PROVIDER_FAILURE_RATE: ${PROVIDER_FAILURE_RATE:-0.05}
    ports: ["8083:8083"]

  audit-service:
    <<: *java
    build: { context: ., args: { SERVICE: audit-service } }
    environment:
      <<: *java-env
      MONGO_URI: mongodb://mongo:27017/audit
    depends_on:
      kafka: { condition: service_healthy }
      mongo: { condition: service_healthy }
    ports: ["8084:8084"]

  console:
    build: ./console
    environment:
      ORDERFLOW_API_KEY: ${ORDERFLOW_API_KEY:-local-dev-key-change-me}
    ports: ["8080:8080"]
    depends_on: [order-service, inventory-service, payment-service, audit-service]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    volumes: [./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

volumes:
  pgdata:
  mongodata:
